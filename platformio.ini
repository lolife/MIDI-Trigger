; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
;extra_scripts = pre:scripts/remove_appledouble.py
lib_deps = 
	m5stack/M5Unified
	m5stack/M5UnitSynth@^1.0.1
monitor_speed = 115200
build_flags = 
	-fpermissive
	-DESP32S3
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
monitor_port = /dev/cu.usbmodem2101
upload_port = ${env:m5stack-cores3.monitor_port}

[env:m5stack-core-esp32]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
;extra_scripts = pre:scripts/remove_appledouble.py

lib_deps = 
    m5stack/M5Unified
    m5stack/M5UnitSynth

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_M5Stack_Core_ESP32
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
monitor_port = /dev/cu.usbserial-58FE0074911
upload_port = ${env:m5stack-core-esp32.monitor_port}
